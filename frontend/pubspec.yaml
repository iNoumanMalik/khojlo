name: khojlo
description: "Khojlo — discover local businesses"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.1

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # state management
  flutter_riverpod: ^2.6.1

  # routing
  go_router: ^14.6.2

  # networking + auth storage
  dio: ^5.7.0
  flutter_secure_storage: ^9.2.4

  # design system
  google_fonts: ^6.2.1
  cached_network_image: ^3.4.1
  shimmer: ^3.0.0
  flutter_animate: ^4.5.2

  # maps (Module 6 prototype)
  google_maps_flutter: ^2.10.0
  google_sign_in: ^7.2.0
  # web-only: renders Google's sign-in button (authenticate() is unsupported on web)
  google_sign_in_web: ^1.1.3
  pinput: ^6.0.2

  # device location (Module 4: "near me" search, distance filter, pinning a business)
  geolocator: ^14.0.2

  # business photos + profile pictures (gallery / camera roll; a file picker on web)
  image_picker: ^1.2.3
  # "Call" on a business page (tel: links)
  url_launcher: ^6.3.2

  # web: lets buttons and cards drawn over a Google map receive taps
  pointer_interceptor: ^0.10.1+3
  # web-only: loads the Google Maps JavaScript API with the key from --dart-define
  web: ^1.1.1

  # Module 9: live chat over a WebSocket
  web_socket_channel: ^3.0.3
  # push notifications (Firebase Cloud Messaging; Android + web)
  firebase_core: ^4.15.0
  firebase_messaging: ^16.7.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

# Regenerate with: dart run flutter_launcher_icons
flutter_launcher_icons:
  image_path: "../docs/brand/khojlo-logo-package/png/khojlo-app-icon-cream-square-1024.png"
  android: "ic_launcher"
  adaptive_icon_background: "#FBF6EE"
  adaptive_icon_foreground: "../docs/brand/khojlo-logo-package/png/khojlo-app-icon-cream-square-1024.png"
  ios: true
  remove_alpha_ios: true
